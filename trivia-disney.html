<!DOCTYPE html>
<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Trivia Disney Experta - Maite, Isidora y Mamá ✨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a40 0%, #4b0082 50%, #7b2ff7 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 140px 80px, #fff, transparent),
      radial-gradient(1px 1px at 220px 50px, #ffd, transparent),
      radial-gradient(2px 2px at 300px 120px, #fff, transparent),
      radial-gradient(1px 1px at 380px 200px, #fff, transparent),
      radial-gradient(2px 2px at 80px 250px, #ffd, transparent);
    background-size: 400px 300px;
    opacity: 0.5;
    animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.3; } to { opacity: 0.7; } }
  .card {
    position: relative; z-index: 1;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 640px;
    padding: 32px;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
  }
  .subtitle { text-align: center; opacity: 0.85; margin-bottom: 22px; font-size: 0.95rem; }
  .players-setup { display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px; }
  .player-chip {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.1);
    padding: 12px 16px; border-radius: 14px;
  }
  .player-chip .emoji { font-size: 1.6rem; }
  .player-chip .name { font-weight: bold; font-size: 1.1rem; flex: 1; }
  /* Configuración de jugadores editable */
  .setup-label { text-align: center; font-weight: bold; margin-bottom: 12px; font-size: 1rem; }
  .players-inputs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .player-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 14px; }
  .player-row .emoji { font-size: 1.5rem; }
  .player-row input {
    flex: 1; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 1rem; font-family: inherit;
  }
  .player-row input:focus { outline: none; border-color: #ffd700; }
  .player-row input::placeholder { color: rgba(255,255,255,0.5); }
  .player-row .remove {
    background: rgba(231,76,60,0.85); color: #fff; width: 34px; height: 34px;
    border-radius: 8px; font-size: 1.1rem; line-height: 1; flex-shrink: 0; font-weight: bold;
  }
  .player-row .remove:hover { background: #e74c3c; }
  .btn-add {
    width: 100%; padding: 12px; font-size: 0.98rem; font-weight: bold;
    background: rgba(255,255,255,0.18); color: #fff; border-radius: 12px; margin-bottom: 18px;
  }
  .btn-add:hover { background: rgba(255,255,255,0.3); }
  .btn-add:disabled { opacity: 0.4; cursor: default; }
  button {
    font-family: inherit; cursor: pointer; border: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    width: 100%; padding: 16px; font-size: 1.1rem; font-weight: bold;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a40; border-radius: 14px;
    box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(255,140,0,0.55); }
  .turn-banner {
    text-align: center; font-size: 1.15rem; font-weight: bold;
    padding: 12px; border-radius: 14px; margin-bottom: 16px;
    background: rgba(255,255,255,0.12);
  }
  .progress { text-align: center; opacity: 0.8; margin-bottom: 14px; font-size: 0.9rem; }
  .question { font-size: 1.18rem; line-height: 1.4; margin-bottom: 22px; text-align: center; min-height: 64px; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    padding: 15px 18px; font-size: 1.0rem; text-align: left;
    background: rgba(255,255,255,0.12); color: #fff;
    border-radius: 14px; border: 2px solid transparent;
  }
  .option:hover { background: rgba(255,255,255,0.22); }
  .option.correct { background: #2ecc71; border-color: #fff; }
  .option.wrong { background: #e74c3c; border-color: #fff; }
  .option:disabled { cursor: default; }
  .scores { display: flex; justify-content: space-around; margin-bottom: 18px; gap: 8px; }
  .score-box {
    flex: 1; text-align: center; padding: 10px 6px; border-radius: 12px;
    background: rgba(255,255,255,0.1); font-size: 0.85rem;
  }
  .score-box.active { background: rgba(255,215,0,0.3); box-shadow: 0 0 0 2px #ffd700; }
  .score-box .pts { font-size: 1.4rem; font-weight: bold; display: block; }
  .next-btn {
    margin-top: 20px; width: 100%; padding: 14px; font-size: 1rem; font-weight: bold;
    background: rgba(255,255,255,0.2); color: #fff; border-radius: 12px;
  }
  .next-btn:hover { background: rgba(255,255,255,0.32); }
  .hidden { display: none; }
  .feedback { text-align: center; margin-top: 16px; font-size: 1.05rem; min-height: 26px; font-weight: bold; }
  .inter { text-align: center; }
  .inter .big-emoji { font-size: 4.5rem; animation: bounce 1s infinite alternate; }
  .inter h2 { font-size: 1.7rem; margin: 14px 0 6px; color: #ffd700; text-shadow: 0 2px 12px rgba(255,215,0,0.6); }
  .inter p { opacity: 0.9; margin-bottom: 22px; font-size: 1.02rem; line-height: 1.4; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  .winner { text-align: center; }
  .winner .crown { font-size: 4rem; animation: bounce 1s infinite alternate; }
  .winner h2 { font-size: 1.9rem; margin: 10px 0; color: #ffd700; text-shadow: 0 2px 12px rgba(255,215,0,0.6); }

    display: flex; justify-content: space-between; padding: 12px 18px;
    border-radius: 12px; background: rgba(255,255,255,0.1); font-size: 1.1rem;
  }
  .final-row.first { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a40; font-weight: bold; }
</style>

<body>
<div class="stars"></div>
<div class="card">

  <!-- PANTALLA DE INICIO -->
  <div id="start-screen">
    <h1>✨ Trivia Disney · Nivel Experto ✨</h1>
    <p class="subtitle">200 preguntas difíciles · cada jugador@ responde sus 10, una detrás de la otra</p>
    <p class="setup-label">¿Quiénes juegan? Escriban sus nombres 👇</p>
    <div class="players-inputs" id="players-inputs"></div>
    <button class="btn-add" id="add-player-btn" onclick="addPlayerRow()">➕ Agregar jugador@</button>
    <p class="subtitle">Cada partida elige preguntas al azar del banco de 200. ¡Que gane quien más sepa de Disney!</p>
    <button class="btn-primary" onclick="startGame()">🎬 ¡Empezar la trivia!</button>
  </div>

  <!-- PANTALLA DE PASE DE TURNO -->
  <div id="inter-screen" class="hidden">
    <div class="inter">
      <div class="big-emoji" id="inter-emoji">👧</div>
      <h2 id="inter-title"></h2>
      <p id="inter-text"></p>
      <button class="btn-primary" id="inter-btn" onclick="beginPlayerRound()">▶️ Comenzar mis 10 preguntas</button>
    </div>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="game-screen" class="hidden">
    <div class="scores" id="scores"></div>
    <div class="turn-banner" id="turn-banner"></div>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">Siguiente ➜</button>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="end-screen" class="hidden">
    <div class="winner">
      <div class="crown">👑</div>
      <h2 id="winner-text"></h2>
    </div>
    <div class="final-scores" id="final-scores"></div>
    <button class="btn-primary" onclick="restart()">🔄 Jugar de nuevo</button>
  </div>

</div>

<script>
  const QUESTIONS_PER_PLAYER = 10;

  // Jugadores: se arman desde la pantalla de inicio (cualquiera puede jugar)
  let players = [];
  const EMOJIS = ["👧","🧒","👑","🦸‍♀️","🧙‍♀️","🦁","🐭","🐤","🌟","🎀","🦄","🐯","🏰","🧚‍♀️","👸","🤴","🐣","🐰","🦋","⭐"];
  const DEFAULT_NAMES = ["", "", ""];
  const MAX_PLAYERS = 20;

  // Crea una fila de nombre en la pantalla de inicio
  function addPlayerRow(name) {
    const box = document.getElementById("players-inputs");
    if (box.children.length >= MAX_PLAYERS) return;
    const row = document.createElement("div");
    row.className = "player-row";
    row.innerHTML =
      `<span class="emoji"></span>
       <input type="text" maxlength="20" placeholder="Nombre del jugador@" value="${name ? name.replace(/"/g, '&quot;') : ''}">
       <button class="remove" title="Quitar" onclick="removePlayerRow(this)">✕</button>`;
    box.appendChild(row);
    refreshRows();
  }

  function removePlayerRow(btn) {
    const box = document.getElementById("players-inputs");
    if (box.children.length <= 1) return; // siempre al menos 1 jugador@
    btn.closest(".player-row").remove();
    refreshRows();
  }

  // Actualiza los emojis por posición y habilita/deshabilita botones
  function refreshRows() {
    const box = document.getElementById("players-inputs");
    const rows = box.querySelectorAll(".player-row");
    rows.forEach((row, i) => {
      row.querySelector(".emoji").textContent = EMOJIS[i % EMOJIS.length];
      const rm = row.querySelector(".remove");
      rm.style.visibility = rows.length <= 1 ? "hidden" : "visible";
    });
    document.getElementById("add-player-btn").disabled = rows.length >= MAX_PLAYERS;
  }

  // Inicializa la pantalla de inicio con los nombres por defecto
  function initSetup() {
    const box = document.getElementById("players-inputs");
    box.innerHTML = "";
    DEFAULT_NAMES.forEach(n => addPlayerRow(n));
  }

  // --- Sonidos (Web Audio, sin archivos externos: funciona offline) ---
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  // Reproduce una secuencia de notas [{f: frecuencia, t: inicio(s), d: duración(s)}]
  function playNotes(notes, type) {
    const ctx = getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = n.f;
      const start = now + n.t;
      const end = start + n.d;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(end + 0.02);
    });
  }

      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    // Lee los nombres escritos en la pantalla de inicio
    const inputs = document.querySelectorAll("#players-inputs input");
    players = [];
    inputs.forEach((inp, i) => {
      const name = inp.value.trim() || `Jugador@ ${i + 1}`;
      players.push({ name: name, emoji: EMOJIS[i % EMOJIS.length], score: 0 });
    });
    if (players.length === 0) { alert("Escribe al menos un nombre para jugar 🎬"); return; }

    // Reparte 10 preguntas por jugador@ (sin repetir; si hay muchos jugadores, vuelve a barajar)
    const need = players.length * QUESTIONS_PER_PLAYER;
    let pool = [];
    while (pool.length < need) pool = pool.concat(shuffle(questionBank));
    const picked = pool.slice(0, need);
    playerQuestions = [];
    for (let i = 0; i < players.length; i++) {
      playerQuestions.push(picked.slice(i * QUESTIONS_PER_PLAYER, (i + 1) * QUESTIONS_PER_PLAYER));
    }
    currentPlayer = 0;
    document.getElementById("start-screen").classList.add("hidden");
    showInterstitial();
  }

  function showInterstitial() {
    const player = players[currentPlayer];
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("inter-screen").classList.remove("hidden");
    document.getElementById("inter-emoji").textContent = player.emoji;
    document.getElementById("inter-title").textContent = `¡Prepárate, ${player.name}!`;
    let aviso = "";
    if (currentPlayer > 0) aviso = "Que nadie le sople las respuestas 🤫. ";
    document.getElementById("inter-text").textContent =
      `${aviso}Vienen tus ${QUESTIONS_PER_PLAYER} preguntas, una detrás de la otra. ¡Mucha suerte!`;
    document.getElementById("inter-btn").textContent = `▶️ Comenzar las 10 de ${player.name}`;
  }

  function beginPlayerRound() {
    currentQ = 0;
    document.getElementById("inter-screen").classList.add("hidden");
    document.getElementById("game-screen").classList.remove("hidden");
    renderQuestion();
  }

  function renderScores() {
    const box = document.getElementById("scores");
    box.innerHTML = players.map((p, i) =>
      `<div class="score-box ${i === currentPlayer ? 'active' : ''}">
         ${p.emoji} ${p.name}
         <span class="pts">${p.score}</span>
       </div>`
    ).join("");
  }

  function renderQuestion() {
    answered = false;
    const player = players[currentPlayer];
    const item = playerQuestions[currentPlayer][currentQ];

    renderScores();
    document.getElementById("turn-banner").textContent = `${player.emoji} ¡Turno de ${player.name}!`;
    document.getElementById("progress").textContent =
      `Pregunta ${currentQ + 1} de ${QUESTIONS_PER_PLAYER}`;
    document.getElementById("question").textContent = item.q;
    document.getElementById("feedback").textContent = "";
    document.getElementById("next-btn").classList.add("hidden");

    const opts = document.getElementById("options");
    opts.innerHTML = "";
    item.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(i, btn);
      opts.appendChild(btn);
    });
  }

  function selectAnswer(i, btn) {
    if (answered) return;
    answered = true;
    const item = playerQuestions[currentPlayer][currentQ];
    const player = players[currentPlayer];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach((b, idx) => {
      b.disabled = true;
      if (idx === item.answer) b.classList.add("correct");
    });

    const fb = document.getElementById("feedback");
    if (i === item.answer) {
      player.score++;
      fb.textContent = `✅ ¡Correcto, ${player.name}! +1 punto`;
      soundCorrect();
    } else {
      btn.classList.add("wrong");
      fb.textContent = `❌ ¡Casi! La respuesta correcta está marcada en verde.`;
      soundWrong();
    }

    renderScores();
    const nextBtn = document.getElementById("next-btn");
    const lastQuestion = currentQ + 1 >= QUESTIONS_PER_PLAYER;
    const lastPlayer = currentPlayer + 1 >= players.length;
    if (lastQuestion && lastPlayer) nextBtn.textContent = "Ver resultado final 🏆";
    else if (lastQuestion) nextBtn.textContent = "Pasar el turno ➜";
    else nextBtn.textContent = "Siguiente ➜";
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentQ++;
    if (currentQ < QUESTIONS_PER_PLAYER) {
      renderQuestion();
    } else {
      currentPlayer++;
      if (currentPlayer < players.length) {
        showInterstitial();
      } else {
        showResults();
      }
    }
  }

  function showResults() {
    document.getElementById("game-screen").classList.add("hidden");
    document.getElementById("inter-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.remove("hidden");

    const sorted = [...players].sort((a, b) => b.score - a.score);
    const top = sorted[0].score;
    const winners = sorted.filter(p => p.score === top);

    const winnerText = document.getElementById("winner-text");
    if (winners.length === 1) {
      winnerText.textContent = `¡${winners[0].name} gana la corona de Disney! 🎉`;
    } else {
      winnerText.textContent = `¡Empate entre ${winners.map(w => w.name).join(" y ")}! 🎉`;
    }

    soundWin();
    document.getElementById("final-scores").innerHTML = sorted.map((p, i) =>
      `<div class="final-row ${i === 0 ? 'first' : ''}">
         <span>${i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉'} ${p.emoji} ${p.name}</span>
         <span>${p.score} / ${QUESTIONS_PER_PLAYER} pts</span>
       </div>`
    ).join("");
  }

  function restart() {
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("start-screen").classList.remove("hidden");
  }

  // Inicializa la pantalla de inicio al cargar la página
  initSetup();
</script>
</body>
</html>
